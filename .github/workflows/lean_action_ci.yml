name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      # The algorithms available, and some of the behaviour the tests pin down,
      # are properties of whichever OpenSSL the runner happens to carry.
      - name: Record the OpenSSL being linked
        run: |
          pkg-config --modversion libcrypto
          openssl version -a
      - uses: leanprover/lean-action@v1
